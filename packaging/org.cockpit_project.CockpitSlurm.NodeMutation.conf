<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.cockpit_project.CockpitSlurm.NodeMutation"/>
  </policy>
  <policy user="cockpit-slurm">
    <allow send_destination="org.cockpit_project.CockpitSlurm.NodeMutation"
           send_interface="org.cockpit_project.CockpitSlurm.NodeMutation"
           send_member="SetNodeState"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.cockpit_project.CockpitSlurm.NodeMutation"/>
  </policy>
</busconfig>